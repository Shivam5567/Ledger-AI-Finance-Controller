app = 'ledger-ai-server'
primary_region = 'iad'

[build]
  builder = 'paketobuildpacks/builder:base'
  buildpacks = ['paketo-buildpacks/nodejs']

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 50
    soft_limit = 25

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
